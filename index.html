<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Letter Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: #08080c;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .input-box {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      padding: 24px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: opacity 0.5s ease;
    }
    .input-box input {
      padding: 12px 18px;
      border-radius: 25px;
      border: 1px solid #ff4d6d;
      outline: none;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 16px;
      width: 240px;
      text-align: center;
    }
    .input-box button {
      display: block;
      margin: 15px auto 0;
      padding: 10px 24px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(45deg, #ff4d6d, #c9184a);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
      transition: transform 0.2s;
    }
    .input-box button:active {
      transform: scale(0.95);
    }
    #reset-btn {
      position: fixed;
      bottom: 25px;
      z-index: 10;
      display: none;
      padding: 8px 18px;
      background: rgba(255,255,255,0.1);
      color: #ffb3c1;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Input Card -->
  <div class="input-box" id="inputContainer">
    <input type="text" id="userInput" placeholder="Type your text or feelings..." maxlength="30" value="I LOVE YOU">
    <button id="startBtn">Make Heart ❤️</button>
  </div>

  <button id="reset-btn" onclick="resetAnimation()">Type Again ↺</button>
  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    let particles = [];
    let isFormed = false;
    let angle = 0;

    // Heart Shape Mathematical Formula
    function getHeartPoint(t, scale = 14) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    class LetterParticle {
      constructor(char, targetX, targetY) {
        this.char = char;
        this.targetX = targetX;
        this.targetY = targetY;
        // Start randomly on screen
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 5;
        this.vy = (Math.random() - 0.5) * 5;
        this.size = Math.random() * 4 + 13;
        this.color = ["#ff4d6d", "#ff758f", "#ff8fa3", "#ffb3c1", "#fff"][Math.floor(Math.random() * 5)];
      }

      update(beat) {
        const destX = width / 2 + this.targetX * beat;
        const destY = height / 2 + this.targetY * beat;

        // Move towards heart coordinates smoothly
        this.x += (destX - this.x) * 0.05;
        this.y += (destY - this.y) * 0.05;
      }

      draw() {
        ctx.font = `bold ${this.size}px monospace`;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#ff4d6d";
        ctx.fillText(this.char, this.x, this.y);
      }
    }

    function createLetterHeart(text) {
      particles = [];
      const cleanText = text.trim() || "LOVE";
      const totalPoints = 140; // Number of letters forming the heart

      for (let i = 0; i < totalPoints; i++) {
        const t = (i / totalPoints) * Math.PI * 2;
        const pt = getHeartPoint(t, 13);
        const char = cleanText[i % cleanText.length];
        particles.push(new LetterParticle(char, pt.x, pt.y));
      }
    }

    function animate() {
      ctx.fillStyle = "rgba(8, 8, 12, 0.25)";
      ctx.fillRect(0, 0, width, height);

      if (isFormed) {
        angle += 0.05;
        const beat = 1 + Math.sin(angle) * 0.08; // Heartbeat pulsing

        particles.forEach(p => {
          p.update(beat);
          p.draw();
        });
      }
      requestAnimationFrame(animate);
    }
    animate();

    const startBtn = document.getElementById("startBtn");
    const inputContainer = document.getElementById("inputContainer");
    const userInput = document.getElementById("userInput");
    const resetBtn = document.getElementById("reset-btn");

    startBtn.addEventListener("click", () => {
      const val = userInput.value;
      inputContainer.style.display = "none";
      resetBtn.style.display = "block";
      createLetterHeart(val);
      isFormed = true;
    });

    function resetAnimation() {
      isFormed = false;
      ctx.clearRect(0, 0, width, height);
      inputContainer.style.display = "block";
      resetBtn.style.display = "none";
    }
  </script>
</body>
</html>
