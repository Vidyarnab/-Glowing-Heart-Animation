// Heart shape formula
function heartPoint(t, scale) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t);

  return {
    x: x * scale,
    y: -y * scale
  };
}

// Create evenly spaced horizontal rows
const rows = 19;
const maxWidth = 310;
const maxHeight = 250;

for (let row = 0; row < rows; row++) {
  const y = -1 + (row / (rows - 1)) * 2;

  // Heart width at this height
  const widthFactor = Math.sqrt(Math.max(0, 1 - y * y));
  const count = Math.max(1, Math.round(widthFactor * 5));

  for (let col = 0; col < count; col++) {
    const span = document.createElement("span");
    span.className = "word";

    const index = (row * 3 + col * 7) % messages.length;
    span.textContent = messages[index];

    const xPos = count === 1
      ? 0
      : (col / (count - 1) - 0.5) * widthFactor * maxWidth;

    const yPos = y * maxHeight / 2;

    span.style.left = `calc(50% + ${xPos}px)`;
    span.style.top = `calc(50% + ${yPos}px)`;
    span.style.fontSize = "10px";
    span.style.letterSpacing = "0.3px";
    span.style.lineHeight = "1.2";
    span.style.whiteSpace = "nowrap";
    span.style.animationDelay = `${Math.random() * 2}s`;

    heart.appendChild(span);
  }
}
</script>
