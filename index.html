<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viral Star Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace;
    }
    body {
      background: #000002;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      buildHeartMap();
    });

    const lovePhrases = [
      "I LOVE YOU",
      "MAIN TUMSE PYAR KARTA HOON",
      "JE T'AIME",
      "TE AMO",
      "TI AMO",
      "ICH LIEBE DICH",
      "AISHITERU",
      "SARANGHAE",
      "YA TEBYA LYUBLYU",
      "UHEBBUKA",
      "AMI TOMAKE BHALOBASHI",
      "WO AI NI"
    ];

    // Combine all phrases into one continuous string
    const fullTextStream = lovePhrases.join("   ").toUpperCase();

    // Heart mathematical formula
    function getHeartPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    class LetterPoint {
      constructor(char, x, y, order) {
        this.char = char;
        this.x = x;
        this.y = y;
        this.order = order;
        this.visible = false;

        // Individual star twinkling setup
        this.twinklePhase = Math.random() * Math.PI * 2;
        this.twinkleSpeed = 0.03 + Math.random() * 0.05;
        this.isSparkleWhite = Math.random() < 0.25;
      }

      update(currentCount) {
        if (currentCount >= this.order) {
          this.visible = true;
        }
        this.twinklePhase += this.twinkleSpeed;
      }

      draw(beat, isComplete) {
        if (!this.visible) return;

        // Gentle pulse anchored at screen center
        const drawX = width / 2 + this.x * beat;
        const drawY = height / 2 + this.y * beat;

        let alpha = 0.85;
        let shadowBlur = 4;
        let color = "#ff2a6d";

        if (isComplete) {
          const sine = Math.sin(this.twinklePhase);
          alpha = 0.25 + (sine + 1) * 0.35; // Twinkle brightness range
          shadowBlur = 3 + (sine + 1) * 6;

          if (this.isSparkleWhite && sine > 0.6) {
            color = "#ffffff";
            shadowBlur = 10;
          }
        }

        ctx.save();
        ctx.font = "bold 8px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = color;
        ctx.globalAlpha = alpha;
        ctx.shadowColor = "#ff2a6d";
        ctx.shadowBlur = shadowBlur;
        ctx.fillText(this.char, drawX, drawY);
        ctx.restore();
      }
    }

    let points = [];
    let lettersDrawn = 0;
    let totalTargetLetters = 0;

    function buildHeartMap() {
      points = [];
      lettersDrawn = 0;

      // Scale to make the heart large on any device screen
      const scale = Math.min(width, height) / 28;

      // Multiple dense layers from outer border to inner core
      const densityLayers = [
        { scale: scale * 1.00, count: 260 },
        { scale: scale * 0.90, count: 220 },
        { scale: scale * 0.80, count: 180 },
        { scale: scale * 0.70, count: 150 },
        { scale: scale * 0.60, count: 120 },
        { scale: scale * 0.48, count: 90 },
        { scale: scale * 0.35, count: 60 }
      ];

      let charIndex = 0;
      let orderIndex = 0;

      densityLayers.forEach((layer) => {
        for (let i = 0; i < layer.count; i++) {
          const t = (i / layer.count) * Math.PI * 2;
          const pos = getHeartPoint(t, layer.scale);
          const char = fullTextStream[charIndex % fullTextStream.length];
          charIndex++;

          // Store point
          points.push(new LetterPoint(char, pos.x, pos.y, orderIndex));
          orderIndex++;
        }
      });

      totalTargetLetters = points.length;
    }

    buildHeartMap();

    let beatPhase = 0;

    function animate() {
      // Clear black screen
      ctx.fillStyle = "#000002";
      ctx.fillRect(0, 0, width, height);

      // Revealing letters step by step
      if (lettersDrawn < totalTargetLetters) {
        lettersDrawn += 2; // Revealing speed
      }

      const isComplete = lettersDrawn >= totalTargetLetters;

      // Heartbeat pulse only after full shape is drawn
      let beat = 1;
      if (isComplete) {
        beatPhase += 0.04;
        beat = 1 + Math.sin(beatPhase) * 0.025;
      }

      for (let i = 0; i < points.length; i++) {
        points[i].update(lettersDrawn);
        points[i].draw(beat, isComplete);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
