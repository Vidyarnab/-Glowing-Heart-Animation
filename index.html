<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multilingual Glowing Heart ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #050508;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initParticles();
    });

    // 12 alag-alag languages me "I Love You"
    const loveQuotes = [
      "I Love You",           // English
      "मैं तुमसे प्यार करता हूँ",    // Hindi
      "Je t'aime",            // French
      "Te amo",               // Spanish
      "愛してる",               // Japanese (Aishiteru)
      "사랑해",                // Korean (Saranghae)
      "Ti amo",               // Italian
      "Ich liebe dich",       // German
      "Я люблю тебя",         // Russian
      "أحبك",                 // Arabic
      "আমি তোমায় ভালোবাসি",    // Bengali
      "我爱你"                 // Chinese (Wo ai ni)
    ];

    // Math formula for Heart curve
    function getHeartPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    class TextParticle {
      constructor(text, t, layerScale, fontSize) {
        this.text = text;
        this.t = t;
        this.layerScale = layerScale;
        this.fontSize = fontSize;
        this.color = [
          "#ff2a6d", "#ff5c8a", "#ff758f", "#ff8fa3", "#ffb3c1", "#ff4d6d", "#ffffff"
        ][Math.floor(Math.random() * 7)];
        this.speed = (Math.random() * 0.003 + 0.002) * (Math.random() > 0.5 ? 1 : -1);
      }

      update() {
        this.t += this.speed;
        if (this.t > Math.PI * 2) this.t -= Math.PI * 2;
        if (this.t < 0) this.t += Math.PI * 2;
      }

      draw(beat) {
        const pt = getHeartPoint(this.t, this.layerScale * beat);
        const posX = width / 2 + pt.x;
        const posY = height / 2 + pt.y;

        ctx.save();
        ctx.translate(posX, posY);
        
        ctx.font = `600 ${this.fontSize}px 'Segoe UI', sans-serif`;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#ff2a6d";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.text, 0, 0);
        ctx.restore();
      }
    }

    let particles = [];

    function initParticles() {
      particles = [];
      const baseScale = Math.min(width, height) / 38; // Screen ke hisab se responsive scale

      // Outer Layer - Phrases
      const outerCount = 45;
      for (let i = 0; i < outerCount; i++) {
        const t = (i / outerCount) * Math.PI * 2;
        const quote = loveQuotes[i % loveQuotes.length];
        particles.push(new TextParticle(quote, t, baseScale, 13));
      }

      // Middle Layer - Multi-language words
      const midCount = 35;
      for (let i = 0; i < midCount; i++) {
        const t = (i / midCount) * Math.PI * 2 + 0.1;
        const quote = loveQuotes[(i * 3) % loveQuotes.length];
        particles.push(new TextParticle(quote, t, baseScale * 0.72, 11));
      }

      // Inner Layer - Tiny glowing sparks
      const innerCount = 20;
      for (let i = 0; i < innerCount; i++) {
        const t = (i / innerCount) * Math.PI * 2;
        particles.push(new TextParticle("❤️", t, baseScale * 0.45, 12));
      }
    }

    initParticles();

    let angle = 0;
    function animate() {
      // Trail effect
      ctx.fillStyle = "rgba(5, 5, 8, 0.35)";
      ctx.fillRect(0, 0, width, height);

      // Heartbeat pulse calculation
      angle += 0.05;
      const beat = 1 + Math.sin(angle) * 0.07;

      particles.forEach((p) => {
        p.update();
        p.draw(beat);
      });

      // Center glowing heart pulse
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `bold ${24 * beat}px 'Segoe UI', sans-serif`;
      ctx.fillStyle = "#ffffff";
      ctx.shadowBlur = 20;
      ctx.shadowColor = "#ff0055";
      ctx.fillText("Forever & Always", width / 2, height / 2);
      ctx.restore();

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
