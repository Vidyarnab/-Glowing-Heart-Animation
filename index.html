<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background: #060208;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      buildLayout();
    });

    // Exact video phrases
    const PHRASES = [
      "I love you Babu ❤️",
      "My Babu",
      "Meri Jaan",
      "Mera Pyaara Babu",
      "My Cute Don",
      "My Heart is Yours",
      "Sirf Tum ❤️",
      "Meri Khushi",
      "My Princess",
      "You Complete Me",
      "I Miss You Babu",
      "Meri Pagli",
      "My Sweetheart",
      "Dil Sirf Tumhara",
      "Babu Meri Jaan",
      "Endless Love",
      "Tum Meri Zindagi Ho",
      "My One And Only",
      "Hamesha Tumhara",
      "You Are My Happiness",
      "Jaan Se Pyari",
      "Mera Sukoon",
      "Love You Chota Don",
      "Meri Favourite Person",
      "Babu + Me = Forever",
      "Made For Each Other",
      "Meri Dhadkan",
      "I Choose You Always"
    ];

    const SIZES = [9, 10, 11, 12];
    let items = [];

    // Heart horizontal span calculation for horizontal text layout
    function getHeartWidthAtY(yNorm) {
      // yNorm ranges from -1.3 (bottom point) to +1.1 (top lobes)
      if (yNorm < -1.3 || yNorm > 1.15) return null;
      
      if (yNorm >= 0) {
        // Upper lobes with dip in middle
        const r = Math.sqrt(Math.max(0, 1 - Math.pow(Math.abs(yNorm - 0.5) / 0.6, 2)));
        return { minX: 0.15, maxX: 0.15 + r * 0.95 }; // Symmetric across center
      } else {
        // Bottom V-taper
        const w = (yNorm + 1.3) / 1.3 * 1.1;
        return { minX: 0, maxX: Math.max(0.05, w) };
      }
    }

    function buildLayout() {
      items = [];
      const SC = Math.min(width, height) / 4.4;
      const rows = 26;
      let pIdx = 0;

      for (let r = 0; r < rows; r++) {
        const yNorm = 1.05 - (r / (rows - 1)) * 2.25;
        const yPx = -yNorm * SC;
        const span = getHeartWidthAtY(yNorm);
        if (!span) continue;

        const size = SIZES[r % SIZES.length];
        ctx.font = `bold ${size}px Arial`;

        // Right lobe / right side
        const rightWidth = span.maxX * SC;
        let curX = span.minX * SC;
        while (curX + 45 < rightWidth) {
          const txt = PHRASES[pIdx % PHRASES.length];
          pIdx++;
          const tw = ctx.measureText(txt).width;
          const posX = curX + tw / 2;
          const angle = Math.atan2(yPx, posX);
          items.push({ text: txt, x: posX, y: yPx, size: size, angle: angle, isEdge: (curX === span.minX * SC || curX + tw + 20 >= rightWidth) });
          curX += tw + 14;
        }

        // Left lobe / left side
        curX = -span.minX * SC;
        while (curX - 45 > -rightWidth) {
          const txt = PHRASES[pIdx % PHRASES.length];
          pIdx++;
          const tw = ctx.measureText(txt).width;
          const posX = curX - tw / 2;
          const angle = Math.atan2(yPx, posX);
          items.push({ text: txt, x: posX, y: yPx, size: size, angle: angle, isEdge: (curX === -span.minX * SC || curX - tw - 20 <= -rightWidth) });
          curX -= tw + 14;
        }
      }

      // Sort order matching Python animation sequence:
      // 1. Right upper & curve -> 2. Bottom tip -> 3. Left curve -> 4. Center inner fill
      const edges = items.filter(p => p.isEdge);
      const inners = items.filter(p => !p.isEdge);

      edges.sort((a, b) => b.angle - a.angle);
      items = edges.concat(inners);
    }

    buildLayout();

    let step = 0;
    let pulseTime = 0;

    function render() {
      ctx.fillStyle = "#060208";
      ctx.fillRect(0, 0, width, height);

      if (step < items.length) {
        step += 0.35; // Reveal speed matching the reel
      }

      let beat = 1;
      if (step >= items.length) {
        pulseTime += 0.045;
        beat = 1 + Math.sin(pulseTime) * 0.025;
      }

      const count = Math.min(items.length, Math.floor(step));
      for (let i = 0; i < count; i++) {
        const item = items[i];
        const posX = width / 2 + item.x * beat;
        const posY = height / 2 + (item.y + 25) * beat;

        ctx.save();
        ctx.font = `bold ${item.size}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Red neon glow
        ctx.shadowColor = "#ff0022";
        ctx.shadowBlur = 10;
        ctx.fillStyle = "#ff1f35";
        ctx.fillText(item.text, posX, posY);

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ff6170";
        ctx.fillText(item.text, posX, posY);
        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
