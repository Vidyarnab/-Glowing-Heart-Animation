<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Star Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    }
    body {
      background: #040407;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      buildHeart();
    });

    // 12 alag-alag bhashaon ke prem vakya
    const sentences = [
      "I LOVE YOU",
      "MAIN TUMSE PYAAR KARTA HOON",
      "JE T AIME",
      "TE AMO",
      "TI AMO",
      "ICH LIEBE DICH",
      "AISHITERU",
      "SARANGHAE",
      "YA TEBYA LYUBLYU",
      "UHEBBUKA",
      "AMI TOMAKE BHALOBASHI",
      "WO AI NI"
    ];

    // Saare characters ko ek long continuous stream me convert karna
    const charStream = sentences.join(" • ").split("");

    function getHeartPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    class LetterNode {
      constructor(char, x, y, delay) {
        this.char = char;
        this.baseX = x;
        this.baseY = y;
        this.delay = delay;
        this.revealed = false;

        // Twinkle (star spark) properties
        this.twinklePhase = Math.random() * Math.PI * 2;
        this.twinkleSpeed = 0.04 + Math.random() * 0.05;
        this.baseColor = Math.random() > 0.4 ? "#ff4370" : "#ffffff";
        this.glowIntensity = 6 + Math.random() * 12;
      }

      update(frame) {
        if (frame >= this.delay) {
          this.revealed = true;
        }
        this.twinklePhase += this.twinkleSpeed;
      }

      draw(beat, allFormed) {
        if (!this.revealed) return;

        // Pulse position with heartbeat
        const posX = width / 2 + this.baseX * beat;
        const posY = height / 2 + this.baseY * beat;

        // Star twinkling brightness
        let alpha = 0.85;
        let glow = this.glowIntensity;

        if (allFormed) {
          const spark = Math.sin(this.twinklePhase);
          alpha = 0.4 + (spark + 1) * 0.3; // 0.4 se 1.0 ke beech shine
          glow = 4 + (spark + 1) * 10;
        }

        ctx.save();
        ctx.font = "bold 9px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = this.baseColor;
        ctx.globalAlpha = alpha;
        ctx.shadowColor = "#ff2a6d";
        ctx.shadowBlur = glow;
        ctx.fillText(this.char, posX, posY);
        ctx.restore();
      }
    }

    let nodes = [];
    let frameCount = 0;
    let totalNodes = 0;

    function buildHeart() {
      nodes = [];
      frameCount = 0;

      // Screen size ke mutabik bada scale
      const heartScale = Math.min(width, height) / 30;

      // Multi-layer structure (Bada heart + Dense fill)
      const layers = [
        { scale: heartScale * 1.00, count: 280 }, // Outer edge
        { scale: heartScale * 0.88, count: 220 }, // 2nd edge
        { scale: heartScale * 0.74, count: 180 }, // Mid layer
        { scale: heartScale * 0.58, count: 140 }, // Inner ring
        { scale: heartScale * 0.40, count: 90 }   // Deep core
      ];

      let streamIdx = 0;
      let stepCounter = 0;

      layers.forEach((layer) => {
        for (let i = 0; i < layer.count; i++) {
          const t = (i / layer.count) * Math.PI * 2;
          const pt = getHeartPoint(t, layer.scale);
          const ch = charStream[streamIdx % charStream.length];
          streamIdx++;

          // Har ek letter ko thoda delay dekar sequential reveal karna
          nodes.push(new LetterNode(ch, pt.x, pt.y, stepCounter));
          stepCounter += 0.8;
        }
      });

      totalNodes = nodes.length;
    }

    buildHeart();

    let heartbeatAngle = 0;

    function animate() {
      // Clear canvas with deep dark trace
      ctx.fillStyle = "#040407";
      ctx.fillRect(0, 0, width, height);

      frameCount += 1.5;
      const allFormed = frameCount > totalNodes * 0.8;

      // Heartbeat pulse calculation
      let beat = 1;
      if (allFormed) {
        heartbeatAngle += 0.045;
        beat = 1 + Math.sin(heartbeatAngle) * 0.035;
      }

      for (let i = 0; i < nodes.length; i++) {
        nodes[i].update(frameCount);
        nodes[i].draw(beat, allFormed);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
