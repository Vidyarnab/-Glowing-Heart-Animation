<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Love You Sentences Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    body {
      background: #000000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      generateSentences();
    });

    // 12 alag-alag languages ke complete sentences
    const languages = [
      "I Love You",
      "मैं तुमसे प्यार करता हूँ",
      "Je t'aime",
      "Te amo",
      "Ti amo",
      "Ich liebe dich",
      "愛してる",
      "사랑해",
      "Я тебя люблю",
      "أحبك",
      "আমি তোমাকে ভালোবাসি",
      "Wo ai ni"
    ];

    // Mathematical Heart coordinates
    function getHeartCoords(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    // Tangent angle taaki sentences curve ke shape ke sath naturally turn hon
    function getTangentAngle(t) {
      const delta = 0.001;
      const p1 = getHeartCoords(t - delta, 1);
      const p2 = getHeartCoords(t + delta, 1);
      return Math.atan2(p2.y - p1.y, p2.x - p1.x);
    }

    class SentenceSpark {
      constructor(text, t, scale, fontSize) {
        this.text = text;
        this.t = t;
        this.scale = scale;
        this.fontSize = fontSize;
        this.angle = getTangentAngle(t);

        // Star twinkle properties
        this.twinkleOffset = Math.random() * Math.PI * 2;
        this.twinkleRate = 0.04 + Math.random() * 0.05;
        this.isHighlight = Math.random() < 0.35;
      }

      update() {
        this.twinkleOffset += this.twinkleRate;
      }

      draw(beat) {
        const pt = getHeartCoords(this.t, this.scale * beat);
        const posX = width / 2 + pt.x;
        const posY = height / 2 + pt.y;

        // Twinkle calculation
        const pulse = Math.sin(this.twinkleOffset);
        let alpha = 0.45 + (pulse + 1) * 0.25;
        let glow = 4 + (pulse + 1) * 8;
        let color = "#ff2d55";

        if (this.isHighlight && pulse > 0.5) {
          color = "#ffffff";
          glow = 14;
          alpha = 1;
        }

        ctx.save();
        ctx.translate(posX, posY);
        ctx.rotate(this.angle);

        ctx.font = `600 ${this.fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = color;
        ctx.globalAlpha = alpha;
        ctx.shadowColor = "#ff0055";
        ctx.shadowBlur = glow;

        ctx.fillText(this.text, 0, 0);
        ctx.restore();
      }
    }

    let sentenceList = [];

    function generateSentences() {
      sentenceList = [];
      const baseScale = Math.min(width, height) / 32;

      // Outer layers aur inner layers taaki heart bada aur filled dikhe
      const rings = [
        { scale: baseScale * 1.05, count: 26, fontSize: 13 },
        { scale: baseScale * 0.90, count: 22, fontSize: 12 },
        { scale: baseScale * 0.74, count: 18, fontSize: 11 },
        { scale: baseScale * 0.58, count: 14, fontSize: 10 },
        { scale: baseScale * 0.40, count: 10, fontSize: 9 }
      ];

      let textIndex = 0;
      rings.forEach(ring => {
        for (let i = 0; i < ring.count; i++) {
          const t = (i / ring.count) * Math.PI * 2;
          const phrase = languages[textIndex % languages.length];
          textIndex++;

          sentenceList.push(new SentenceSpark(phrase, t, ring.scale, ring.fontSize));
        }
      });
    }

    generateSentences();

    let beatTime = 0;

    function render() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);

      beatTime += 0.04;
      const beat = 1 + Math.sin(beatTime) * 0.035;

      for (let i = 0; i < sentenceList.length; i++) {
        sentenceList[i].update();
        sentenceList[i].draw(beat);
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
