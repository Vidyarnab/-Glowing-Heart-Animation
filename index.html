<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart 3D Coding</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    body {
      background: #000000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      buildHeartLayout();
    });

    const phrases = [
      "Sirf Tum ❤️",
      "You Are My Happiness",
      "My Babu",
      "Hamesha Tumhara",
      "My Princess",
      "Mera Sab Kuch",
      "My One And Only",
      "Endless Love",
      "My Beautiful Babu",
      "Chota Don ❤️",
      "Mera Sukoon",
      "Meri Favourite Person",
      "Mera Sab Kuch",
      "Babu Meri Duniya",
      "Jaan Se Pyari",
      "I Love You Babu ❤️",
      "My Cute Don",
      "Meri Khushi",
      "Meri Jaan",
      "You Are My Everything",
      "Meri Dhadkan",
      "Only You Babu",
      "Babu + Me = Forever",
      "I Choose You Always",
      "Love You Chota Don",
      "My Love ❤️",
      "You Complete Me",
      "Mera Pyaara Babu",
      "Tum Meri Zindagi Ho",
      "Meri Pagli",
      "Forever And Always",
      "My Sweetheart",
      "I Miss You Babu",
      "You Own My Heart"
    ];

    // Standard Heart Curve: x = 16*sin^3(t), y = -(13*cos(t) - 5*cos(2t) - 2*cos(3t) - cos(4t))
    function getHeartEdge(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3) * scale;
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
      return { x, y };
    }

    class TextItem {
      constructor(text, x, y, order) {
        this.text = text;
        this.x = x;
        this.y = y;
        this.order = order;
      }

      draw(step, beat) {
        if (step < this.order) return;

        // Pulse anchored from heart center
        const posX = width / 2 + this.x * beat;
        const posY = height / 2 + (this.y - 15) * beat;

        ctx.save();
        ctx.font = "bold 8.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Neon Red Shadow & Glow
        ctx.shadowColor = "#ff001a";
        ctx.shadowBlur = 10;
        ctx.fillStyle = "#ff1f2d";
        ctx.fillText(this.text, posX, posY);

        // Core text highlights
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ff5762";
        ctx.fillText(this.text, posX, posY);

        ctx.restore();
      }
    }

    let items = [];
    let totalItems = 0;

    function buildHeartLayout() {
      items = [];
      const baseScale = Math.min(width, height) / 36;

      // 8 Concentric Heart Rings - Outer to Inner Core
      const rings = [
        { scale: baseScale * 1.00, count: 28, stepStart: 0 },
        { scale: baseScale * 0.88, count: 24, stepStart: 0.1 },
        { scale: baseScale * 0.76, count: 20, stepStart: 0 },
        { scale: baseScale * 0.64, count: 16, stepStart: 0.15 },
        { scale: baseScale * 0.52, count: 12, stepStart: 0 },
        { scale: baseScale * 0.40, count: 9,  stepStart: 0.2 },
        { scale: baseScale * 0.26, count: 6,  stepStart: 0 },
        { scale: baseScale * 0.12, count: 2,  stepStart: 0 }
      ];

      let phraseIdx = 0;
      let order = 0;

      rings.forEach(ring => {
        for (let i = 0; i < ring.count; i++) {
          const t = (i / ring.count) * Math.PI * 2 + ring.stepStart;
          const pos = getHeartEdge(t, ring.scale);
          const txt = phrases[phraseIdx % phrases.length];
          phraseIdx++;

          items.push(new TextItem(txt, pos.x, pos.y, order));
          order++;
        }
      });

      // Sort top-to-bottom taaki reel ki tarah shuruat se ant tak structure banta dikhe
      items.sort((a, b) => a.y - b.y);
      for (let i = 0; i < items.length; i++) {
        items[i].order = i;
      }

      totalItems = items.length;
    }

    buildHeartLayout();

    let currentStep = 0;
    let beatTime = 0;

    function animate() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);

      // Slow revealing speed: har frame par aaram se ek-ek sentence appear hoga
      if (currentStep < totalItems) {
        currentStep += 0.25;
      }

      // Full banne ke baad heartbeat pulse
      let beat = 1;
      if (currentStep >= totalItems) {
        beatTime += 0.045;
        beat = 1 + Math.sin(beatTime) * 0.03;
      }

      for (let i = 0; i < items.length; i++) {
        items[i].draw(currentStep, beat);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
