<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart 3D Coding</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    body {
      background: #000000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initPhrases();
    });

    // Exact phrases from the video screenshot
    const phrasesList = [
      "You Are My Happiness",
      "My Princess",
      "Mera Sab Kuch",
      "My Beautiful Babu",
      "Chota Don ❤️",
      "Mera Sab Kuch",
      "Babu Meri Duniya",
      "My Cute Don",
      "Meri Khushi",
      "You Are My Everything",
      "Mera Sukoon",
      "My Sweetheart",
      "Meri Jaan",
      "I love you Babu ❤️",
      "My Beautiful Babu",
      "Hamesha Tumhara",
      "Meri Pagli",
      "Jaan Se Pyari",
      "Meri Dhadkan",
      "You Are My Happiness",
      "Meri Pagli",
      "Forever And Always",
      "My Babu",
      "I Miss You Babu",
      "Sirf Tum ❤️",
      "Forever And Always",
      "My Sweetheart",
      "My Babu",
      "You Complete Me",
      "Mera Pyaara Babu",
      "Mera Sukoon",
      "Tum Meri Zindagi Ho",
      "Endless Love",
      "Only You Babu",
      "My One And Only",
      "I Choose You Always",
      "Forever My Love",
      "You Own My Heart"
    ];

    // Parametric Heart Formula
    function getHeartPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    class TextElement {
      constructor(text, x, y, size, order) {
        this.text = text;
        this.x = x;
        this.y = y;
        this.size = size;
        this.order = order;
      }

      draw(currentStep, beat) {
        if (currentStep < this.order) return;

        const posX = width / 2 + this.x * beat;
        const posY = height / 2 + this.y * beat;

        ctx.save();
        ctx.font = `bold ${this.size}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Intense Red Neon Glow
        ctx.shadowColor = "#ff0015";
        ctx.shadowBlur = 10;
        ctx.fillStyle = "#ff1e27";
        ctx.fillText(this.text, posX, posY);

        // Center brightness
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ff4d52";
        ctx.fillText(this.text, posX, posY);

        ctx.restore();
      }
    }

    let allElements = [];
    let totalCount = 0;

    function initPhrases() {
      allElements = [];
      const baseScale = Math.min(width, height) / 34;

      // Layers matching the filled density of the reel
      const layers = [
        { scale: baseScale * 1.05, step: 0.22, size: 10.5 },
        { scale: baseScale * 0.90, step: 0.25, size: 10 },
        { scale: baseScale * 0.75, step: 0.29, size: 9.5 },
        { scale: baseScale * 0.60, step: 0.35, size: 9 },
        { scale: baseScale * 0.45, step: 0.42, size: 8.5 },
        { scale: baseScale * 0.30, step: 0.55, size: 8 },
        { scale: baseScale * 0.15, step: 0.80, size: 7.5 }
      ];

      let order = 0;
      let phraseIdx = 0;

      layers.forEach(layer => {
        for (let t = -Math.PI; t < Math.PI; t += layer.step) {
          const pt = getHeartPoint(t, layer.scale);
          const txt = phrasesList[phraseIdx % phrasesList.length];
          phraseIdx++;

          allElements.push(new TextElement(txt, pt.x, pt.y, layer.size, order));
          order++;
        }
      });

      totalCount = allElements.length;
    }

    initPhrases();

    let step = 0;
    let pulseTime = 0;

    function animate() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);

      // Appearing speed
      if (step < totalCount) {
        step += 0.8;
      }

      // Heartbeat pulse after full formation
      let beat = 1;
      if (step >= totalCount) {
        pulseTime += 0.05;
        beat = 1 + Math.sin(pulseTime) * 0.03;
      }

      for (let i = 0; i < allElements.length; i++) {
        allElements[i].draw(step, beat);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
