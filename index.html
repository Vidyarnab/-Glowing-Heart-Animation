<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exact Python Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    body {
      background: #000000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      buildExactHeart();
    });

    // Reel ke exact phrases
    const phrases = [
      "Sirf Tum ❤️",
      "You Are My Happiness",
      "My Babu",
      "Hamesha Tumhara",
      "My Princess",
      "Mera Sab Kuch",
      "My One And Only",
      "Endless Love",
      "My Beautiful Babu",
      "Chota Don ❤️",
      "Mera Sukoon",
      "Meri Favourite Person",
      "Mera Sab Kuch",
      "Babu Meri Duniya",
      "Jaan Se Pyari",
      "I Love You Babu ❤️",
      "My Cute Don",
      "Meri Khushi",
      "Meri Jaan",
      "You Are My Everything",
      "Meri Dhadkan",
      "Only You Babu",
      "Babu + Me = Forever",
      "I Choose You Always",
      "Love You Chota Don",
      "My Love ❤️",
      "You Complete Me",
      "Mera Pyaara Babu",
      "Tum Meri Zindagi Ho",
      "Meri Pagli",
      "Forever And Always",
      "My Sweetheart",
      "I Miss You Babu",
      "You Own My Heart"
    ];

    // Python heart exact parametric curve
    // x = 16 * sin(t)^3
    // y = -(13 * cos(t) - 5 * cos(2t) - 2 * cos(3t) - cos(4t))
    function getHeartPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3) * scale;
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
      return { x, y };
    }

    class TextItem {
      constructor(text, x, y, order) {
        this.text = text;
        this.x = x;
        this.y = y;
        this.order = order;
      }

      draw(step, beat) {
        if (step < this.order) return;

        const posX = width / 2 + this.x * beat;
        const posY = height / 2 + (this.y - 20) * beat;

        ctx.save();
        ctx.font = "bold 9px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Red neon glow shadow
        ctx.shadowColor = "#ff001a";
        ctx.shadowBlur = 10;
        ctx.fillStyle = "#ff1f2d";
        ctx.fillText(this.text, posX, posY);

        // Core text highlights
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ff5762";
        ctx.fillText(this.text, posX, posY);

        ctx.restore();
      }
    }

    let items = [];
    let totalItems = 0;

    function buildExactHeart() {
      items = [];
      const baseScale = Math.min(width, height) / 38;

      // 6 concentric heart rings taaki upper curves aur niche ka pointed v-shape dono perfect rahein
      const layers = [
        { scale: baseScale * 1.00, count: 28 },
        { scale: baseScale * 0.86, count: 24 },
        { scale: baseScale * 0.72, count: 20 },
        { scale: baseScale * 0.58, count: 16 },
        { scale: baseScale * 0.44, count: 12 },
        { scale: baseScale * 0.28, count: 8 },
        { scale: baseScale * 0.14, count: 4 }
      ];

      let phraseIdx = 0;
      let order = 0;

      layers.forEach(layer => {
        for (let i = 0; i < layer.count; i++) {
          const t = (i / layer.count) * Math.PI * 2;
          const pos = getHeartPoint(t, layer.scale);
          const txt = phrases[phraseIdx % phrases.length];
          phraseIdx++;

          items.push(new TextItem(txt, pos.x, pos.y, order));
          order++;
        }
      });

      // Sort by Y coordinate so it draws cleanly from top to bottom
      items.sort((a, b) => a.y - b.y);
      for (let i = 0; i < items.length; i++) {
        items[i].order = i;
      }

      totalItems = items.length;
    }

    buildExactHeart();

    let currentStep = 0;
    let beatTime = 0;

    function animate() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);

      // Slow revealing speed: frame by frame steady appearance
      if (currentStep < totalItems) {
        currentStep += 0.25;
      }

      // Heartbeat pulse after full formation
      let beat = 1;
      if (currentStep >= totalItems) {
        beatTime += 0.045;
        beat = 1 + Math.sin(beatTime) * 0.03;
      }

      for (let i = 0; i < items.length; i++) {
        items[i].draw(currentStep, beat);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
