<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart 3D Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    body {
      background: #000000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      generateCleanHeart();
    });

    // Reel ke exact phrases
    const phrases = [
      "Sirf Tum ❤️",
      "You Are My Happiness",
      "My Babu",
      "Hamesha Tumhara",
      "My Princess",
      "Mera Sab Kuch",
      "My One And Only",
      "Endless Love",
      "My Beautiful Babu",
      "Chota Don ❤️",
      "Mera Sukoon",
      "Meri Favourite Person",
      "Mera Sab Kuch",
      "Babu Meri Duniya",
      "Jaan Se Pyari",
      "I Love You Babu ❤️",
      "My Cute Don",
      "Meri Khushi",
      "Meri Jaan",
      "You Are My Everything",
      "Meri Dhadkan",
      "Only You Babu",
      "Babu + Me = Forever",
      "I Choose You Always",
      "Love You Chota Don",
      "My Love ❤️",
      "You Complete Me",
      "Mera Pyaara Babu",
      "Tum Meri Zindagi Ho",
      "Meri Pagli",
      "Forever And Always",
      "My Sweetheart",
      "I Miss You Babu",
      "You Own My Heart"
    ];

    // Heart mathematical formula
    function insideHeart(x, y) {
      const nx = x;
      const ny = -y;
      const a = nx * nx + ny * ny - 1;
      return (a * a * a - nx * nx * ny * ny * ny) <= 0;
    }

    class PhraseSlot {
      constructor(text, x, y, order) {
        this.text = text;
        this.x = x;
        this.y = y;
        this.order = order;
      }

      draw(progress, beat) {
        if (progress < this.order) return;

        const posX = width / 2 + this.x * beat;
        const posY = height / 2 + this.y * beat;

        ctx.save();
        ctx.font = "bold 8.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Red neon glow shadow
        ctx.shadowColor = "#ff001e";
        ctx.shadowBlur = 8;
        ctx.fillStyle = "#ff1e2b";
        ctx.fillText(this.text, posX, posY);

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ff5964";
        ctx.fillText(this.text, posX, posY);

        ctx.restore();
      }
    }

    let heartSlots = [];
    let totalItems = 0;

    function generateCleanHeart() {
      heartSlots = [];
      const rows = 26;
      const colStep = 75; // Overlapping rokne ke liye clean gap

      const heartScale = Math.min(width, height) * 0.44;
      let phraseIndex = 0;
      let orderIndex = 0;

      for (let r = 0; r < rows; r++) {
        const yNorm = 1.25 - (r / (rows - 1)) * 2.5;
        const yPx = -yNorm * heartScale;

        let minX = 0;
        let maxX = 0;
        for (let xNorm = -1.6; xNorm <= 1.6; xNorm += 0.02) {
          if (insideHeart(xNorm, yNorm)) {
            if (minX === 0 || xNorm < minX) minX = xNorm;
            if (maxX === 0 || xNorm > maxX) maxX = xNorm;
          }
        }

        if (minX !== 0 && maxX !== 0 && maxX > minX) {
          const widthPx = (maxX - minX) * heartScale;
          const countInRow = Math.max(1, Math.floor(widthPx / colStep));

          for (let c = 0; c < countInRow; c++) {
            const frac = countInRow === 1 ? 0.5 : (c + 0.5) / countInRow;
            const xNorm = minX + frac * (maxX - minX);
            const xPx = xNorm * heartScale;

            if (insideHeart(xNorm, yNorm)) {
              const text = phrases[phraseIndex % phrases.length];
              phraseIndex++;
              heartSlots.push(new PhraseSlot(text, xPx, yPx, orderIndex));
              orderIndex++;
            }
          }
        }
      }

      totalItems = heartSlots.length;
    }

    generateCleanHeart();

    let stepCounter = 0;
    let pulseTime = 0;

    function render() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);

      // Slow speed animation (ek-ek sentence dikhega)
      if (stepCounter < totalItems) {
        stepCounter += 0.28;
      }

      let beat = 1;
      if (stepCounter >= totalItems) {
        pulseTime += 0.04;
        beat = 1 + Math.sin(pulseTime) * 0.025;
      }

      for (let i = 0; i < heartSlots.length; i++) {
        heartSlots[i].draw(stepCounter, beat);
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
